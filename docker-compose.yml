services:
  db:
    image: postgres:17
    container_name: spendsense-db
    environment:
      POSTGRES_USER: spendsense
      POSTGRES_PASSWORD: spendsense
      POSTGRES_DB: spendsense
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendsense -d spendsense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: